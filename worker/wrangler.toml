# Cloudflare Pages configuration for the Bro Gang AI free endpoint.
#
# Deploy:
#   npx wrangler pages deploy public
#
# The site serves two things: a static landing page (public/) and an
# OpenAI-compatible API (functions/[[path]].js) that the CLI calls.
#
# The name MUST match the live project or `wrangler pages deploy` silently
# creates a second, empty site: brogangaicli.pages.dev is the one the CLI
# (BroGangBaseURL) and the WinGet manifest both point at.

name = "brogangaicli"
compatibility_date = "2026-01-01"
pages_build_output_dir = "public"

# Workers AI binding. The free plan includes a daily inference allowance.
[ai]
binding = "AI"

# Model used when the client does not pass an @cf/ prefixed model id.
[vars]
BG_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"

# Optional: per-client rate limiting. Create a KV namespace and uncomment.
# [kv_namespaces]
# binding = "CACHE"
# id = "<your-kv-namespace-id>"

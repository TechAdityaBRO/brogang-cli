name: Release

# Builds every supported binary in the cloud and attaches it to a GitHub
# Release. Nothing is compiled on a developer machine: tag it, push, done.
#
#   git tag v0.1.0
#   git push origin v0.1.0

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp (e.g. 0.1.0)"
        required: true
        default: "0.1.0"

permissions:
  contents: write

env:
  APP: brogang

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Build
        shell: bash
        run: |
          ext=""
          [ "${{ matrix.goos }}" = "windows" ] && ext=".exe"
          name="${APP}-${{ matrix.goos }}-${{ matrix.goarch }}"
          out="dist/${name}${ext}"

          # Windows binaries are zipped, everything else ships as a tarball
          # so checksums and extraction behave the same on every platform.
          mkdir -p dist stage/"$name"
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags "-s -w -X main.Version=$VERSION" \
            -o "stage/$name/$APP$ext" ./cmd/brogang

          cp README.md LICENSE "stage/$name/" 2>/dev/null || true

          if [ "${{ matrix.goos }}" = "windows" ]; then
            (cd stage && zip -qr "../$out" "$name")
          else
            tar -C stage -czf "dist/${name}.tar.gz" "$name"
          fi

          echo "NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: dist/*
          if-no-files-found: error

  checksums:
    name: Checksums
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA256SUMS
        shell: bash
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) \
            -exec cp {} dist/ \;
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: dist/SHA256SUMS.txt

  release:
    name: Publish release
    needs: [version, build, checksums]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          notes=$(cat <<'EOF'
          ## Bro Gang AI CLI

          No signup. No API key. Just run it.

          ```bash
          # Linux / macOS
          tar -xzf brogang-linux-amd64.tar.gz && ./brogang-linux-amd64/brogang

          # Windows
          # unzip brogang-windows-amd64.zip
          ```

          The default provider is the free hosted Bro Gang AI endpoint —
          it works on first run with zero configuration.
          EOF
          )

          # workflow_dispatch has no tag yet, so create one first.
          if ! git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            git init -q
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git commit --allow-empty -q -m "release v$VERSION"
            git tag "v$VERSION"
            git push -q origin "v$VERSION"
          fi

          gh release create "v$VERSION" \
            --title "Bro Gang AI CLI v$VERSION" \
            --notes "$notes" \
            artifacts/* \
            || gh release upload "v$VERSION" artifacts/* --clobber

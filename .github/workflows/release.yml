name: Release

# Builds every supported binary in the cloud and attaches it to a GitHub
# Release. Nothing is compiled on a developer machine: tag it, push, done.
#
#   git tag v0.1.0
#   git push origin v0.1.0

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp (e.g. 0.1.0)"
        required: true
        default: "0.1.0"

permissions:
  contents: write

env:
  APP: brogang

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: linux,   goarch: arm,   goarm: 7 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Build
        shell: bash
        run: |
          ext=""
          [ "${{ matrix.goos }}" = "windows" ] && ext=".exe"
          name="${APP}-${{ matrix.goos }}-${{ matrix.goarch }}"

          # The ARCHIVE name, never the binary name. `ext` only suffixes the
          # executable that sits *inside* the archive; reusing it here wrote
          # the Windows zip as "brogang-windows-amd64.exe", which the
          # *.tar.gz|*.zip filter in Checksums then dropped entirely, so
          # SHA256SUMS.txt shipped without the Windows builds.
          if [ "${{ matrix.goos }}" = "windows" ]; then
            out="dist/${name}.zip"
          else
            out="dist/${name}.tar.gz"
          fi

          # Windows binaries are zipped, everything else ships as a tarball
          # so checksums and extraction behave the same on every platform.
          mkdir -p dist stage/"$name"
          # Build
          if [ "${{ matrix.goarch }}" = "arm" ]; then
            GOARM=7
          fi
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} ${GOARM:+GOARM=$GOARM} \
            go build -trimpath -ldflags "-s -w -X main.Version=$VERSION" \
            -o "stage/$name/$APP$ext" ./cmd/brogang

          cp README.md LICENSE "stage/$name/" 2>/dev/null || true

          if [ "${{ matrix.goos }}" = "windows" ]; then
            # Entries sit at the archive root (no wrapping folder) so winget's
            # portable installer finds brogang.exe without a nested path.
            (cd "stage/$name" && zip -qr "$GITHUB_WORKSPACE/$out" ./*)
          else
            tar -C stage -czf "dist/${name}.tar.gz" "$name"
          fi

          echo "NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: dist/*
          if-no-files-found: error

  checksums:
    name: Checksums
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA256SUMS
        shell: bash
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.deb' -o -name '*.rpm' \) \
            -exec cp {} dist/ \;
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: dist/SHA256SUMS.txt

  # Linux package-format uploads. A plain tarball is awkward for Raspberry
  # Pi users, so we convert the same build to .deb (Debian/Ubuntu/Raspberry
  # Pi OS) and .rpm (Fedora/openSUSE) here. Nothing is built from source
  # twice: we unpack the already-built tarballs and re-package them.
  linux_packages:
    name: Linux .deb & .rpm
    needs: [version, build, checksums]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev alien

      - name: Create .deb and .rpm
        shell: bash
        run: |
          set -e
          mkdir -p pkgroot
          for f in artifacts/brogang-linux-*.tar.gz; do
            [ -e "$f" ] || continue
            base=$(basename "$f" .tar.gz)
            rm -rf "pkgroot/$base"
            mkdir -p "pkgroot/$base/DEBIAN"
            tar -C "pkgroot/$base" -xzf "$f"
            printf 'Package: %s\nVersion: %s\nSection: utils\nPriority: optional\nArchitecture: all\nMaintainer: Aditya Kumar Sethi <pglove@atomicmail.io>\nDescription: Bro Gang AI CLI - AI coding agent for the terminal\n Free, open source AI coding agent.\n' "$base" "$VERSION" > "pkgroot/$base/DEBIAN/control"
            dpkg-deb --build "pkgroot/$base" "${base}.deb"
            alien --to-rpm --scripts "${base}.deb" || true
          done
          ls -l *.deb *.rpm

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: "*.deb *.rpm"
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, build, checksums]
    # workflow_dispatch is allowed too so a broken release can be retried
    # without deleting and re-pushing the tag (which would also re-trigger
    # the npm publish).
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # There is no checkout in this job, so gh cannot discover the repository
      # from a git remote — it died with "failed to run git: not a git
      # repository". GH_REPO tells it explicitly.
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          notes=$(cat <<'EOF'
          ## Bro Gang AI CLI

          No signup. No API key. Just run it.

          ```bash
          # Linux / macOS
          tar -xzf brogang-linux-amd64.tar.gz && ./brogang-linux-amd64/brogang

          # Windows
          # unzip brogang-windows-amd64.zip
          ```

          The default provider is the free hosted Bro Gang AI endpoint —
          it works on first run with zero configuration.
          EOF
          )

          # This job has no checkout step, so there is no local repository, no
          # remote and no git identity — the old `git ls-remote` always failed
          # and the fallback `git commit` died with "empty ident name" (128).
          # Create the tag through the API instead, and only for a manual
          # dispatch: a tag push already has one.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/v${VERSION}" -f sha="${sha}" >/dev/null 2>&1 || true
          fi

          # Create the release if it does not exist yet; otherwise only ADD
          # assets that are missing. Re-running this job - which is how the
          # Pages deploy gets re-triggered - rebuilds the Windows zips with
          # new mtimes, so clobbering would change their SHA256. A WinGet
          # manifest pins that hash forever, and `winget install` would then
          # fail its integrity check. If an asset really must be replaced,
          # delete it from the release page first.
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" \
              --title "Bro Gang AI CLI v$VERSION" \
              --notes "$notes" \
              artifacts/*
            exit 0
          fi

          existing=$(gh release view "v$VERSION" --json assets --jq '.assets[].name')
          for f in artifacts/*; do
            name=$(basename "$f")
            if grep -qxF "$name" <<<"$existing"; then
              echo "keep  $name (already published)"
            else
              gh release upload "v$VERSION" "$f"
              echo "add   $name"
            fi
          done

  # Pushes the landing page plus the Windows archives to Cloudflare Pages, so
  # the WinGet manifest can download from https://brogangaicli.pages.dev rather
  # than from github.com. The Pages project is not connected to GitHub (no
  # GitHub App installation on the account), so it has to be deployed from here.
  #
  # Needs CLOUDFLARE_API_TOKEN (Pages: Edit) and CLOUDFLARE_ACCOUNT_ID. When
  # the token is missing the job still goes green and just says so, so a repo
  # without Cloudflare credentials never shows a red run.
  pages:
    name: Deploy Pages
    needs: [version, build, checksums]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Stage downloads
        shell: bash
        run: |
          mkdir -p worker/public/downloads
          cp artifacts/brogang-windows-*.zip worker/public/downloads/
          if [ -f artifacts/SHA256SUMS.txt ]; then
            cp artifacts/SHA256SUMS.txt worker/public/downloads/
          fi
          ls -l worker/public/downloads

      - name: Check Cloudflare credentials
        id: gate
        shell: bash
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID not set - skipping the Pages deploy"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.gate.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler-action has no token-verification step (it has no `verify`
          # input), and the token is scoped to Cloudflare Pages:Edit only -
          # confirmed against the live API: GET /accounts/.../pages/projects
          # returns the brogangaicli project. GET /accounts/{id} itself returns
          # 9109 without Account Settings:Read, so do not add a whoami here.
          workingDirectory: worker
          command: pages deploy public --project-name brogangaicli

  # Opens a PR against microsoft/winget-pkgs. Requires WINGET_TOKEN (a classic
  # PAT with public_repo + workflow scopes) and a TechAdityaBRO/winget-pkgs
  # fork. Skipped cleanly when the secret is absent so a missing token never
  # shows up as a red run.
  winget:
    name: Submit to WinGet
    # `pages` is in the chain because the manifest's InstallerUrl points at
    # brogangaicli.pages.dev - that file has to be live before winget can
    # fetch and hash it.
    needs: [version, release, pages]
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - name: Check WinGet prerequisites
        id: gate
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          BOOTSTRAPPED: ${{ vars.WINGET_BOOTSTRAPPED }}
        shell: bash
        run: |
          # vedantmgoyal9/winget-releaser can only UPDATE a package that is
          # already in microsoft/winget-pkgs. v0.1.0 is submitted by hand, so
          # until that first manifest merges the job must skip, not fail.
          if [ -z "$WINGET_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::WINGET_TOKEN is not set - skipping the WinGet submission"
          elif [ "$BOOTSTRAPPED" != "true" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::First WinGet manifest not merged yet - skipping (expected for v0.1.0)"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to WinGet
        if: steps.gate.outputs.ready == 'true'
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: BROGANG.BroGangCLI
          version: ${{ needs.version.outputs.version }}
          installers-regex: '^brogang-windows-(amd64|arm64)\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}
